# Tests the app, then builds the Windows installer (.exe via NSIS, plus .msi).
# - Manual run (Actions tab > "Run workflow"): installers attached as a build artifact.
# - Pushing a tag like v0.1.0: also creates a draft GitHub release with the installers.
# Keep this file at .github/workflows/build-windows.yml in the repo.
name: build-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Ideation ${{ github.ref_name }}
          releaseBody: See the README for requirements (Git for Windows, Claude Code, optionally the GitHub CLI).
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: ideation-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
